name: V3 upgrade notice - Publish

on:
  workflow_run:
    workflows: ["V3 upgrade notice - Build"]
    types: [completed]

jobs:
  publish:
    if: github.event.workflow_run.head_branch == 'codex/v3-notice-fixture'
    permissions:
      contents: write
      pull-requests: write
    uses: WordPress/action-wp-playground-pr-preview/.github/workflows/preview-publish.yml@v3
    with:
      kind: plugin
      release-tag: v3-notice-built
